<!-- templates/error/404.html -->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{_layout/main :: layout(~{::title}, ~{::section}, ~{::extrahead}, true, true)}">
    <title>404 - Không tìm thấy</title>

    <th:block th:fragment="extrahead">
        <style>
            .error-box{min-height:calc(100vh - 160px)}
        </style>
    </th:block>

    <section>
        <div class="error-box d-flex align-items-center justify-content-center">
            <div class="text-center">
                <h1 class="display-4">404</h1>
                <p class="text-muted mb-3">Trang bạn tìm không tồn tại.</p>
                <a class="btn btn-primary" th:href="@{/tay-cam/home}">Về trang chủ</a>
            </div>
        </div>
    </section>
</th:block>
</html>
