<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật đánh giá</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-4">Cập nhật đánh giá</h2>

<form th:action="@{/danh-gia/update}" th:object="${danhGia}" method="post" class="card p-4 shadow-sm">

    <input type="hidden" th:field="*{id}"/>
    <input type="hidden" th:field="*{tayCam.maTayCam}"/>

    <div class="mb-3">
        <label class="form-label">Tên người đánh giá</label>
        <input type="text" th:field="*{tenNguoiDanhGia}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Số sao (1-5)</label>
        <input type="number" th:field="*{soSaoDanhGia}" min="1" max="5" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Nội dung</label>
        <textarea th:field="*{noiDung}" class="form-control" rows="3" required></textarea>
    </div>

    <div class="d-flex justify-content-between">
        <a th:href="@{/tay-cam/chi-tiet/{id}(id=${danhGia.tayCam.maTayCam})}" class="btn btn-secondary">⬅ Quay lại</a>
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
    </div>
</form>

</body>
</html>
