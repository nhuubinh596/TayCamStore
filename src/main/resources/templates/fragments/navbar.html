<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
<nav class="navbar navbar-expand-lg navbar-dark" th:fragment="navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/tay-cam/home}">
            <span style="filter:drop-shadow(0 0 8px rgba(45,212,191,.6))">🎮</span> GC Store
        </a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div id="nav" class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/tay-cam/home}">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Giỏ hàng</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link" th:href="@{/account/profile}">Cập nhật thông tin</a>
                </li>
                <li class="nav-item" th:if="${session.role == 'ADMIN'}">
                    <a class="nav-link" th:href="@{/admin/home}">Admin</a>
                </li>
            </ul>
            <div class="d-flex gap-2">
                <a th:if="${session.user == null}" class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a th:if="${session.user == null}" class="btn btn-brand btn-sm" th:href="@{/register}">Đăng ký</a>
                <a th:if="${session.user != null}" class="btn btn-outline-light btn-sm" th:href="@{/logout}">Đăng xuất</a>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
