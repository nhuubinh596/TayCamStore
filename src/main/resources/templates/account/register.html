<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{_layout/main :: layout(~{::title}, ~{::section}, ~{::extrahead}, true, true)}">

    <title>Đăng ký</title>
    <th:block th:fragment="extrahead">
        <style>
            .auth-card{max-width:720px;margin:auto}
        </style>
    </th:block>

    <section class="auth-page">
        <div class="auth-card card">
            <h3 class="mb-1 text-center">Tạo tài khoản</h3>
            <p class="text-center mb-3">Tham gia GamingController Store để đặt trước nhanh hơn!</p>
            <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
            <div th:if="${param.fromCart}" class="alert alert-info mb-3">
                Hãy đăng ký/đăng nhập để tiếp tục đặt trước.
            </div>

            <form th:action="@{/register}" th:object="${form}" method="post" class="row g-3" autocomplete="off">

                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input class="form-control" th:field="*{username}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control" th:field="*{password}" minlength="6" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Họ tên</label>
                    <input class="form-control" th:field="*{hoTen}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số điện thoại</label>
                    <input class="form-control" th:field="*{soDienThoai}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control" th:field="*{email}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Địa chỉ</label>
                    <input class="form-control" th:field="*{diaChi}">
                    <div class="text-danger small" th:if="${#fields.hasErrors('diaChi')}" th:errors="*{diaChi}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Confirm</label>
                    <input class="form-control" type="password" th:field="*{confirm}" minlength="6" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirm')}" th:errors="*{confirm}"></div>
                </div>

                <div class="col-12 d-flex gap-2 mt-2">
                    <button class="btn btn-brand">Đăng ký</button>
                    <a th:href="@{/login}" class="btn btn-outline-light">Đã có tài khoản? Đăng nhập</a>
                </div>
            </form>
        </div>
    </section>
</th:block>
