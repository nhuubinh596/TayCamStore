<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Tài khoản của tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width:720px">
<h3>Tài khoản của tôi</h3>

<div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

<table class="table mt-3">
    <tr><th>Username</th><td th:text="${user.username}"></td></tr>
    <tr><th>Họ tên</th><td th:text="${user.hoTen} ?: '-'"></td></tr>
    <tr><th>Email</th><td th:text="${user.email} ?: '-'"></td></tr>
    <tr><th>SĐT</th><td th:text="${user.soDienThoai} ?: '-'"></td></tr>
    <tr><th>Địa chỉ</th><td th:text="${user.diaChi} ?: '-'"></td></tr>
</table>

<a th:href="@{/account/profile}" class="btn btn-primary">Cập nhật thông tin</a>
<a th:href="@{/tay-cam/home}" class="btn btn-outline-secondary ms-2">Về trang chủ</a>
</body>
</html>
