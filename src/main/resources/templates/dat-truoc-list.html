<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Danh sách đặt trước</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>📋 Danh sách các đơn đặt trước</h2>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Tên khách hàng</th>
        <th>SĐT</th>
        <th>Email</th>
        <th>Địa chỉ</th>
        <th>Tay cầm</th>
        <th>Giá gốc</th>
        <th>Giá đặt trước</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dt : ${dsDatTruoc}">
        <td th:text="${dt.id}"></td>
        <td th:text="${dt.tenKhachHang}"></td>
        <td th:text="${dt.soDienThoai}"></td>
        <td th:text="${dt.email}"></td>
        <td th:text="${dt.diaChi}"></td>
        <td th:text="${dt.tayCam != null ? dt.tayCam.tenTayCam : '---'}"></td>
        <td th:text="${dt.tayCam != null ? dt.tayCam.gia : '---'}"></td>
        <td>
            <span th:if="${dt.giaDatTruoc != null}"
                  th:text="${dt.giaDatTruoc}"></span>
            <span th:if="${dt.giaDatTruoc == null}">---</span>
        </td>

        <td>
            <a th:href="@{'/dat-truoc/xoa/' + ${dt.id}}"
               class="btn btn-danger btn-sm">Xóa</a>
        </td>
    </tr>
    </tbody>

    <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
        <div>
            <strong th:text="'Trang ' + (${currentPage + 1}) + ' / ' + ${totalPages}"></strong>
            <span th:text="'(Tổng: ' + ${totalItems} + ' đơn đặt trước)'"></span>
        </div>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Page navigation">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{|/dat-truoc/list?page=${currentPage - 1}|}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{|/dat-truoc/list?page=${i}|}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{|/dat-truoc/list?page=${currentPage + 1}|}">Sau</a>
            </li>
        </ul>
    </nav>

</table>

<a href="/tay-cam/home" class="btn btn-secondary">⬅ Quay lại</a>

</body>
</html>
