<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <title>Đặt trước tay cầm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>📌 Đặt trước tay cầm</h2>

<form th:action="@{/dat-truoc/add}" th:object="${datTruoc}" method="post">
    <input type="hidden" name="maTayCam" th:value="${fixTayCam.maTayCam}" />

    <div class="mb-3">
        <label>Tay cầm</label>
        <input type="text" class="form-control" th:value="${fixTayCam.tenTayCam}" readonly>
    </div>
    <div class="mb-3">
        <label>Họ tên khách hàng</label>
        <input type="text" class="form-control" th:field="*{tenKhachHang}" required>
    </div>
    <div class="mb-3">
        <label>Số điện thoại</label>
        <input type="text" class="form-control" th:field="*{soDienThoai}" required>
    </div>
    <div class="mb-3">
        <label>Địa chỉ</label>
        <input type="text" class="form-control" th:field="*{diaChi}" required>
    </div>
    <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" th:field="*{email}" required>
    </div>
    <div class="mb-3">
        <label>Giá gốc</label>
        <input type="text" class="form-control" th:value="${fixTayCam.gia}" readonly>
    </div>

    <div class="alert alert-info mt-2">
    <span th:if="${#temporals.createNow().isBefore(fixTayCam.releaseDate)}">
        🔥 Ưu đãi đặt trước:
        Giảm <b th:text="${fixTayCam.preorderDiscount}"></b>% còn
        <b th:text="${#numbers.formatDecimal(fixTayCam.gia * (1 - fixTayCam.preorderDiscount / 100), 0, 'POINT', 0, 'COMMA')}"></b> VND
    </span>
        <span th:if="${#temporals.createNow().isAfter(fixTayCam.releaseDate)}">
        ✅ Đã mở bán — đặt với giá gốc
    </span>
    </div>


    <button type="submit" class="btn btn-success">Đặt trước</button>
    <a href="/tay-cam/home" class="btn btn-secondary">Quay lại</a>
</form>


</body>
</html>
