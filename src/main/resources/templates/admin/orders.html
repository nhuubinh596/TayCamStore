<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{_layout/main :: layout(~{::title}, ~{::section}, ~{::extrahead}, false, false)}">

    <title>Danh sách Đơn đặt trước</title>

    <th:block th:fragment="extrahead">
        <style>
            .table td,.table th{vertical-align:middle}
            .empty-hint{opacity:.8}
        </style>
    </th:block>

    <section th:with="
              ordersPageObj=${ordersPage},
              orders=${ordersPageObj != null} ? ${ordersPageObj.content} : ${ds}">
        <div class="section-head mb-3"><span>📋</span><strong>Danh sách Đơn đặt trước</strong></div>

        <div class="card p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width:70px">ID</th>
                        <th>Khách hàng</th>
                        <th>Email</th>
                        <th style="width:140px">SĐT</th>
                        <th>Địa chỉ</th>
                        <th style="width:110px" class="text-center">Chi tiết</th>
                        <th style="width:90px" class="text-center">Xoá</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="od : ${orders}">
                        <td th:text="${od.id}">1</td>
                        <td th:text="${od.tenKhachHang}">Tên KH</td>
                        <td th:text="${od.email}">email@example.com</td>
                        <td th:text="${od.soDienThoai}">0123456789</td>
                        <td th:text="${od.diaChi}">Địa chỉ</td>
                        <td class="text-center">
                            <a class="btn btn-sm btn-primary"
                               th:href="@{|/admin/orders/view/${od.id}|}">Xem</a>
                        </td>
                        <td class="text-center">
                            <a class="btn btn-sm btn-outline-danger"
                               th:href="@{|/admin/orders/delete/${od.id}|}"
                               onclick="return confirm('Xoá đơn này?')">Xoá</a>
                        </td>
                    </tr>
                    <tr th:if="${orders == null or #lists.isEmpty(orders)}">
                        <td colspan="7" class="text-center py-4">
                            <div class="empty-hint">Chưa có đơn đặt trước nào.</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <nav class="mt-3" th:if="${ordersPageObj != null and ordersPageObj.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${ordersPageObj.first}? 'disabled'">
                    <a class="page-link" th:href="@{|/admin/orders?page=${ordersPageObj.number-1}|}">Trước</a>
                </li>

                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, ordersPageObj.totalPages-1)}"
                    th:classappend="${i == ordersPageObj.number} ? 'active'">
                    <a class="page-link" th:text="${i+1}"
                       th:href="@{|/admin/orders?page=${i}|}">1</a>
                </li>

                <li class="page-item" th:classappend="${ordersPageObj.last}? 'disabled'">
                    <a class="page-link" th:href="@{|/admin/orders?page=${ordersPageObj.number+1}|}">Sau</a>
                </li>
            </ul>
        </nav>

        <div class="mt-3">
            <a class="btn btn-outline-light" th:href="@{/admin/home}">⬅ Admin Home</a>
        </div>
    </section>
</th:block>
