<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{_layout/main :: layout(~{::title}, ~{::section}, ~{::extrahead}, true, true)}">
    <title>Sửa tay cầm</title>

    <th:block th:fragment="extrahead">
        <style>.card{max-width:720px;margin:auto}</style>
    </th:block>

    <section>
        <div class="section-head mb-3"><span>🛠️</span><strong>Sửa tay cầm</strong></div>

        <div class="card p-4">
            <form th:action="@{|/admin/tay-cam/edit/${tc.maTayCam}|}" method="post"
                  enctype="multipart/form-data" th:object="${tc}" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Tên tay cầm</label>
                    <input class="form-control" th:field="*{tenTayCam}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('tenTayCam')}" th:errors="*{tenTayCam}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hãng</label>
                    <input class="form-control" th:field="*{hangSanXuat}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('hangSanXuat')}" th:errors="*{hangSanXuat}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Số lượng</label>
                    <input class="form-control" th:field="*{soLuongTon}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('soLuongTon')}" th:errors="*{soLuongTon}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Giá</label>
                    <input class="form-control" type="number" step="0.01" min="0" th:field="*{gia}" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('gia')}" th:errors="*{gia}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Ngày & giờ mở bán</label>
                    <input class="form-control" type="datetime-local"
                           th:value="${tc.releaseDate != null ? #temporals.format(tc.releaseDate, 'yyyy-MM-dd''T''HH:mm') : ''}"
                           name="releaseDate">
                    <div class="text-danger small" th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">% ưu đãi đặt trước (tuỳ chọn)</label>
                    <input class="form-control" type="number" step="0.1" min="0" max="100" th:field="*{preorderDiscount}">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Hình ảnh (để trống nếu giữ ảnh cũ)</label>
                    <input class="form-control" type="file" name="file" accept="image/*">
                </div>

                <div class="col-md-6">
                    <div class="mt-2 d-flex align-items-center gap-3" th:if="${tc.hinhAnh}">
                        <span class="text-muted small">Ảnh hiện tại:</span>
                        <div class="card-image" style="width:100%; height:180px; overflow:hidden; border-radius:8px;">
                            <img class="card-thumb"
                                 th:src="${tc.hinhAnh}"
                                 th:alt="${tc.tenTayCam}"
                                 style="width:100%; height:180px; object-fit:cover; display:block;"/>

                            <code class="small" th:text="${tc.hinhAnh}"></code>
                        </div>
                    </div>


                    <div class="col-12 d-flex gap-2 mt-2">
                        <button class="btn btn-primary">Cập nhật</button>
                        <a class="btn btn-outline-light" th:href="@{/admin/tay-cam}">Quay lại</a>
                    </div>
            </form>
        </div>
    </section>
</th:block>
