<th:block xmlns:th="http://www.thymeleaf.org"
          th:replace="~{_layout/main :: layout(~{::title}, ~{::section}, ~{::extrahead}, true, true)}">

    <title>Quản lý Tay cầm</title>

    <th:block th:fragment="extrahead">
        <style>
            .thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#111}
            .table td,.table th{vertical-align:middle}
        </style>
    </th:block>

    <section>
        <div class="section-head mb-3"><span>🎮</span><strong>Quản lý Tay cầm</strong></div>

        <form class="row g-2 mb-3">
            <div class="col-md-4">
                <input class="form-control" name="q" th:value="${q}" placeholder="Tìm theo tên tay cầm...">
            </div>
            <div class="col-auto">
                <button class="btn btn-brand">Tìm kiếm</button>
            </div>
            <div class="col-auto ms-auto">
                <a class="btn btn-primary" th:href="@{/admin/tay-cam/add}">+ Thêm tay cầm</a>
            </div>
        </form>

        <div class="card p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th style="width:80px">ID</th>
                        <th style="width:84px">Hình</th>
                        <th>Tên tay cầm</th>
                        <th>Hãng</th>
                        <th>Số lượng tồn kho</th>
                        <th style="width:160px">Giá</th>
                        <th style="width:180px">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="it : ${ds}">
                        <td th:text="${it.maTayCam}">1</td>
                        <td>
                            <div class="card-image" style="width:100%; height:180px; overflow:hidden; border-radius:8px;">
                                <img class="card-thumb"
                                     th:src="${(it.hinhAnh != null && it.hinhAnh != '') ? it.hinhAnh : '/images/placeholder.png'}"
                                     th:alt="${it.tenTayCam}"
                                     style="width:100%; height:180px; object-fit:cover; display:block;"/>
                            </div>
                        </td>
                        <td class="text-center" th:text="${it.tenTayCam}">Tên</td>
                        <td class="text-center" th:text="${it.hangSanXuat}">Hãng</td>
                        <td class="text-center" th:text="${it.soLuongTon}">Số lượng tồn kho</td>
                        <td class="price" th:text="${#numbers.formatDecimal(it.gia,0,'COMMA',0,'POINT')} + ' ₫'">0 ₫</td>
                        <td>
                            <a class="btn btn-sm btn-primary"
                               th:href="@{|/admin/tay-cam/edit/${it.maTayCam}|}">Sửa</a>
                            <a class="btn btn-sm btn-outline-danger ms-2"
                               th:href="@{|/admin/tay-cam/delete/${it.maTayCam}|}"
                               onclick="return confirm('Xoá tay cầm này?')">Xoá</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ds)}">
                        <td colspan="6" class="text-center py-4">Chưa có dữ liệu.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="mt-3">
            <a class="btn btn-outline-light" th:href="@{/admin/home}">⬅ Admin Home</a>
        </div>

        <!-- Phân trang (số trang 1→N; danh sách vẫn DESC nên item mới nằm trang 1) -->
        <nav class="mt-3" th:if="${totalPages>1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage==0}? 'disabled'">
                    <a class="page-link" th:href="@{|/admin/tay-cam?page=${currentPage-1}${q!=null?'&q='+q:''}|}">Trước</a>
                </li>
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                    th:classappend="${i==currentPage} ? 'active'">
                    <a class="page-link" th:text="${i+1}"
                       th:href="@{|/admin/tay-cam?page=${i}${q!=null?'&q='+q:''}|}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage+1==totalPages}? 'disabled'">
                    <a class="page-link" th:href="@{|/admin/tay-cam?page=${currentPage+1}${q!=null?'&q='+q:''}|}">Sau</a>
                </li>
            </ul>
        </nav>
    </section>
</th:block>
