<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout (title, content, extrahead, showHeader=true, showFooter=true)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!-- Page title (injected fragment) -->
    <title th:replace="${title}">GamingController</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Theme CSS (your main stylesheet) -->
    <link th:href="@{/css/theme-dark.css}" rel="stylesheet">

    <!-- Per-page extra head -->
    <th:block th:replace="${extrahead} ?: ~{}"></th:block>
</head>
<body>

<!-- header fragment (only if showHeader=true) -->
<header th:if="${showHeader}" th:replace="~{_layout/header :: header}"></header>

<!-- MAIN: ensure a wrapper so background/padding consistent across pages -->
<main class="site-main" style="min-height: calc(100vh - 160px);">
    <div class="container">
        <!-- IMPORTANT: content is injected here exactly once -->
        <div th:replace="${content}"></div>
    </div>
</main>

<!-- footer fragment -->
<footer th:if="${showFooter}" th:replace="~{_layout/footer :: footer}"></footer>

<!-- bootstrap js (bundle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

<!-- YOUR site JS (defer so DOM ready and won't block) -->
<!-- Ensure /js/main.js exists under src/main/resources/static/js/main.js -->
<script th:src="@{/js/main.js}" defer></script>

<!-- small noscript hint -->
<noscript style="display:block;padding:12px;text-align:center;background:#2a2a3a;color:#fff;">
    Javascript bị tắt — một vài chức năng có thể không hoạt động.
</noscript>

<script>
    document.addEventListener('DOMContentLoaded', function(){
        try {
            // Remove duplicate top-level .profile-wrapper or duplicate main content blocks
            const wrappers = document.querySelectorAll('.profile-wrapper');
            if (wrappers.length > 1) {
                // keep the FIRST visible one, remove the rest
                for (let i = 1; i < wrappers.length; i++) wrappers[i].remove();
                console.log('Removed duplicate .profile-wrapper elements');
            }

            // remove duplicate main cards heuristic
            const mainCards = document.querySelectorAll('main .card');
            if (mainCards.length > 1) {
                // if headings repeat, likely duplicate - remove later one
                const firstHtml = mainCards[0].innerText.trim().slice(0,120);
                for (let i = 1; i < mainCards.length; i++) {
                    if (mainCards[i].innerText.trim().slice(0,120) === firstHtml) {
                        mainCards[i].remove();
                        console.log('Removed duplicate main .card');
                    }
                }
            }

            // remove duplicate hidden username inputs
            const uname = document.querySelectorAll('input#username');
            if (uname.length > 1) for (let i = 1; i < uname.length; i++) uname[i].remove();

            // if duplicate header/footer exist, remove the second occurrence
            const headers = document.querySelectorAll('header');
            if (headers.length > 1) for (let i = 1; i < headers.length; i++) headers[i].remove();
            const footers = document.querySelectorAll('footer');
            if (footers.length > 1) for (let i = 1; i < footers.length; i++) footers[i].remove();

        } catch(e) {
            console.warn('Duplicate-fix script error', e);
        }
    });
</script>

</body>
</html>
